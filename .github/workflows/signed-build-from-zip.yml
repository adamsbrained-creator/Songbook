name: Signed build from zip

# The convenient one: upload a project zip (for example Songbook-3_0.zip) to the repo, on github.com:
# Add file > Upload files. It can sit in the main folder or in a "zips" folder. The zip is unpacked
# here, built, signed with your release key and published as a Release. No need to unpack and commit
# the project files yourself.
#
# Manual run: Actions > Signed build from zip > Run workflow, optionally with the zip's file name.
on:
  push:
    branches: [ main, master ]
    paths:
      - '*.zip'
      - 'zips/*.zip'
  workflow_dispatch:
    inputs:
      zip:
        description: 'File name of the zip in the repo (empty = the newest one)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: signed-build-zip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to count commits for the version number

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack the zip
        env:
          ZIP_INPUT: ${{ github.event.inputs.zip }}
        run: |
          set -e
          if [ -n "$ZIP_INPUT" ]; then
            ZIP="$ZIP_INPUT"
            [ -f "$ZIP" ] || ZIP="zips/$ZIP_INPUT"
          else
            # the zip added by this push, else the newest one by name
            ZIP=$(git diff-tree --no-commit-id --name-only -r --diff-filter=AM HEAD -- '*.zip' | sort -V | tail -1)
            [ -n "$ZIP" ] || ZIP=$(ls *.zip zips/*.zip 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "::error::No zip found. Upload the project zip to the repo (main folder or zips folder)."
            exit 1
          fi
          echo "Building from $ZIP"
          rm -rf "$RUNNER_TEMP/project" && mkdir -p "$RUNNER_TEMP/project"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/project"
          SETTINGS=$(find "$RUNNER_TEMP/project" -maxdepth 3 -name settings.gradle.kts -not -path '*/__MACOSX/*' | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::$ZIP has no settings.gradle.kts, is it the Songbook project zip?"
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "ZIP_NAME=$(basename "$ZIP")" >> "$GITHUB_ENV"
          grep -q SIGNING_KEYSTORE_FILE "$DIR/app/build.gradle.kts" \
            || echo "::warning::This zip's app/build.gradle.kts has no signing setup, the APK will use the debug key. Use a zip from Songbook 3.0 or later."

      - name: Prepare version and signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "VERSION_CODE=$((1000 + $(git rev-list --count HEAD)))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' "$PROJECT_DIR/app/build.gradle.kts")" >> "$GITHUB_ENV"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/songbook-release.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/songbook-release.jks" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=release key" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 secret is missing, signing with the old debug key instead. See SIGNING.md."
            echo "SIGNED_WITH=old debug key" >> "$GITHUB_ENV"
          fi

      - name: Build signed release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Name the APK and check its signature
        run: |
          APK="Songbook-${VERSION_NAME}-${VERSION_CODE}.apk"
          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          {
            echo "### $APK (from $ZIP_NAME)"
            echo "Signed with: **$SIGNED_WITH** · version code $VERSION_CODE"
            echo '```'
            grep "SHA-256" certs.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: songbook-signed-apk
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zip-build-${{ env.VERSION_CODE }}
          target_commitish: ${{ github.sha }}
          name: Songbook ${{ env.VERSION_NAME }} (build ${{ env.VERSION_CODE }}, from zip)
          body: Built from ${{ env.ZIP_NAME }}, signed with the ${{ env.SIGNED_WITH }}. Install it over the previous version, your songs stay.
          files: ${{ env.APK }}
          make_latest: true
