name: Android build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

# lets the last step publish a Release (the download page for the APK)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installs Gradle itself, so no gradlew / gradle-wrapper.jar is needed in the repo.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/*.apk "Songbook-build-${{ github.run_number }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: songbook-debug-apk
          path: Songbook-build-${{ github.run_number }}.apk
          if-no-files-found: error

      # A Release page per build: Code tab, "Releases" on the right, download the .apk directly.
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Songbook build ${{ github.run_number }}
          body: Debug APK built from commit ${{ github.sha }}. Install it over the previous version, your songs stay.
          files: Songbook-build-${{ github.run_number }}.apk
          make_latest: true
